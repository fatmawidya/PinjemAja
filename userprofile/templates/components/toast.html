{% load static %}
<div id="toast-component" class="toast-component toast-hidden" popover="manual">
    <div class="toast-content">
        <h3 id="toast-title" class="toast-title">Judul</h3>
        <p id="toast-message" class="toast-message">Pesan</p>
    </div>
</div>
<script src="{% static 'js/toast.js' %}"></script>
{% if messages %}
<div id="django-messages" hidden>
    {% for message in messages %}
    <span data-level="{{ message.level_tag }}">{{ message }}</span>
    {% endfor %}
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('#django-messages span').forEach(el => {
        showToast('Berhasil', el.textContent, el.dataset.level);
    });
});
</script>
{% endif %}
