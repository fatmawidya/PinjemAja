{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width: 600px; margin-top: 2rem;">
    <h1>Profil Saya</h1>
    <p><strong>Username:</strong> {{ request.user.username }}</p>
    <p><strong>Email:</strong> {{ request.user.email }}</p>
    <p><strong>No. HP:</strong> {{ profile.phone_number|default:"-" }}</p>
    <p><strong>Alamat:</strong> {{ profile.address|default:"-" }}</p>
    <p><strong>Bio:</strong> {{ profile.bio|default:"-" }}</p>
    <a href="{% url 'userprofile:edit_profile' %}" class="btn btn-primary">Edit Profil</a>
    <a href="{% url 'userprofile:logout' %}" class="btn btn-outline-danger">Logout</a>
</div>
{% endblock %}
