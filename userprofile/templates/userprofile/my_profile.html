{% extends 'userprofile/profile_base.html' %}
{% block profile_content %}
<div class="text-center">
    <div class="profile-avatar mx-auto mb-3">
        {% if profile.avatar %}
            <img src="{{ profile.avatar.url }}" style="width:100%;height:100%;object-fit:cover;">
        {% else %}
            <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        {% endif %}
    </div>
    <h5>@{{ request.user.username }}</h5>
    <a href="{% url 'userprofile:edit_profile' %}" class="btn btn-outline-warning mb-4">Edit Profile</a>
</div>
<div class="text-start">
    <label class="form-label">Nama</label>
    <input class="form-control mb-3" value="{{ request.user.username }}" disabled>
    <label class="form-label">Email</label>
    <input class="form-control mb-3" value="{{ request.user.email }}" disabled>
    <label class="form-label">Nomor Telephone</label>
    <input class="form-control mb-3" value="{{ profile.phone_number|default:'-' }}" disabled>
    <label class="form-label">Alamat Lengkap</label>
    <textarea class="form-control mb-3" disabled>{{ profile.address|default:'-' }}</textarea>
    <label class="form-label">Bio</label>
    <textarea class="form-control mb-3" disabled>{{ profile.bio|default:'-' }}</textarea>
</div>
{% endblock %}
