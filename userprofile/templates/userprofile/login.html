{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width: 480px; margin-top: 2rem;">
    <h1>Login</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <p class="mt-3">Belum punya akun? <a href="{% url 'userprofile:register' %}">Daftar di sini</a></p>
</div>
{% endblock %}
