{% extends 'userprofile/auth.html' %}
{% block auth_content %}
<h2 class="mb-4 text-center">Login</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-pinjemaja-primary w-100">Login</button>
</form>
<p class="mt-3 text-center">Belum punya akun? <a href="{% url 'userprofile:register' %}"><strong>Daftar di sini</strong></a></p>
{% endblock %}
