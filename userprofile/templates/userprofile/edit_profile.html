{% extends 'userprofile/profile_base.html' %}
{% block profile_content %}
<h4 class="mb-4">Edit Profil</h4>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-pinjemaja-primary">Simpan Profil</button>
    <a href="{% url 'userprofile:my_profile' %}" class="btn btn-link">Kembali</a>
</form>
{% endblock %}
