{% extends 'base.html' %}
{% load static %}
{% block meta %}
<link rel="stylesheet" href="{% static 'userprofile/css/profile.css' %}">
<script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-qbtR4rS9RCnu4yegGS36OBQBmb6DGAGmArdakWggiCwZaUxaIY1R9DdQrPFiFVbX" crossorigin="anonymous"></script>
{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    {% block auth_content %}{% endblock %}
  </div>
</div>

{% include 'components/toast.html' %}
<script>
document.body.addEventListener('showToast', function (evt) {
    showToast(evt.detail.title, evt.detail.message, evt.detail.type);
});
</script>
{% endblock %}
