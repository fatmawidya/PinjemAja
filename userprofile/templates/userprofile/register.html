{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width: 480px; margin-top: 2rem;">
    <h1>Daftar Akun</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Daftar</button>
    </form>
    <p class="mt-3">Sudah punya akun? <a href="{% url 'userprofile:login' %}">Login di sini</a></p>
</div>
{% endblock %}
