<form id="edit-profile-form-container"
      hx-post="{% url 'userprofile:edit_profile_htmx' %}"
      hx-target="#edit-profile-form-container"
      hx-swap="outerHTML"
      hx-encoding="multipart/form-data">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">Provinsi</label>
        <select id="province-select" class="form-select">
            <option value="">Pilih Provinsi</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Kota/Kabupaten</label>
        <select id="city-select" name="city" class="form-select" disabled>
            <option value="">Pilih Kota/Kabupaten</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Kecamatan</label>
        <select id="district-select" name="district" class="form-select" disabled>
            <option value="">Pilih Kecamatan</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Kelurahan</label>
        <select id="subdistrict-select" name="subdistrict" class="form-select" disabled>
            <option value="">Pilih Kelurahan</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Alamat Jalan</label>
        <textarea name="street_address" class="form-control" placeholder="Nama jalan, nomor rumah, RT/RW">{{ profile.street_address }}</textarea>
    </div>
    <input type="hidden" name="province" id="province-hidden">

    {{ form.as_p }}

    <button type="submit" class="btn btn-pinjemaja-primary">Simpan Profil</button>
    <a href="{% url 'userprofile:my_profile' %}" class="btn btn-link">Kembali</a>
</form>
