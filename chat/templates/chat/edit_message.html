{% extends "base.html" %}

{% block meta %}
<title>Edit Pesan - PinjemAja</title>
{% endblock meta %}

{% block content %}
<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">

            <div class="card shadow-sm">

                <!-- Header -->
                <div class="card-header bg-white p-3">
                    <h4 class="fw-bold mb-0">
                        Edit Pesan
                    </h4>
                </div>

                <!-- Form edit -->
                <div class="card-body p-4">

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label
                                for="{{ form.text.id_for_label }}"
                                class="form-label fw-semibold">
                                Isi Pesan
                            </label>

                            {{ form.text }}

                            {% if form.text.errors %}
                                <div class="text-danger small mt-2">
                                    {{ form.text.errors }}
                                </div>
                            {% endif %}
                        </div>

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-warning fw-bold">
                                Simpan Perubahan
                            </button>

                            <a href="{% url 'chat:conversation_detail' message.conversation_id %}"
                               class="btn btn-outline-secondary">
                                Batal
                            </a>

                        </div>
                    </form>

                </div>

            </div>
        </div>
    </div>

</div>
{% endblock content %}
