<header class="site-header {% if user.is_authenticated %}is-auth{% else %}is-guest{% endif %}">
    <div class="header-inner">

        <a href="{% url 'landing_page' %}" class="header-brand">
            <span class="header-logo">{% include 'logo.html' %}</span>
            <span class="brand-text">Pinjem<span>Aja</span></span>
        </a>

        <!-- TODO (modul search): isi action dengan URL pencarian -->
        <form class="header-search" action="" method="GET" role="search">
            <span class="search-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            </span>
            <input type="text" name="input" placeholder="Cari di PinjemAja" aria-label="Cari barang">
        </form>

        <nav class="header-nav">
            <a href="{% url 'landing_page' %}" class="nav-pill">Beranda</a>

            {% if user.is_authenticated %}
                {# TODO: ganti href dengan URL modul chat dan modul profil #}
                <a href="#" class="nav-icon-link">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v12H9l-5 4V4z"/></svg>
                    <span>Chat</span>
                </a>
                <a href="#" class="nav-icon-link">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
                    <span>User</span>
                </a>
            {% else %}
                {# TODO: ganti href dengan URL halaman daftar dan login #}
                <a href="#" class="nav-outline">Daftar</a>
                <a href="#" class="nav-outline">Login</a>
            {% endif %}
        </nav>

    </div>
</header>
